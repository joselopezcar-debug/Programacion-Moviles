name: Compilar App Ventas (Grupo A)

on:
  push:
    branches: [ main, manual, ia-asistida ]
    paths:
      - 'Semana_11/Ventas/**'

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Semana_11/Ventas
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar para Simulador iOS
        run: |
          xcodebuild -project Ventas.xcodeproj \
            -scheme Ventas \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Empaquetar para Appetize.io
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r ../../../../../Ventas-Appetize.zip Ventas.app

      - name: Subir archivo listo para Appetize
        uses: actions/upload-artifact@v4
        with:
          name: Ventas-Appetize
          path: Semana_11/Ventas/Ventas-Appetize.zip
